  <style>
    @import url("https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap");

    :root {

      --ivory-light: #fffdf8;
      --beige: #e8dcc8;
      --gold: #b89555;

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: "Tajawal", "Segoe UI", Tahoma, Arial, sans-serif;

      pointer-events: none;

    }

      isolation: isolate;

      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      padding: 46px 18px 28px;

      border-radius: 36px;
      background: rgba(255, 253, 248, 0.7);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: card-arrival 1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .celebration-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      z-index: -1;
      border: 1px solid rgba(184, 149, 85, 0.22);
      border-radius: 28px;
      pointer-events: none;
    }

      gap: 10px;
